apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      serviceAccountName: my-service-account
      containers:
      - name: customer-service
        image: cihadacar/customer-service:latest
        ports:
        - containerPort: 8080
        env:
        - name: AWS_REGION
          value: "eu-central-1"
        readinessProbe:
          httpGet:
            path: /health #readiness altindaki health endpointi deploydan sonra servis ayakta mi diye kontrol eder
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health #liveness altindaki health endpointi periyodik olarak servis ayakta mi diye kontrol eder
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
spec:
  type: ClusterIP #LoadBalancer
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: custoemr-service